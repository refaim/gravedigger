name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CGO_ENABLED: '0'

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            target: windows-x86_64
            archive: gravedigger-windows-x86_64.zip
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            target: linux-x86_64
            archive: gravedigger-linux-x86_64.tar.gz
          - os: macos-latest
            goos: darwin
            goarch: arm64
            target: macos-arm64
            archive: gravedigger-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
          architecture: ${{ matrix.goarch }}
          cache: false

      - name: Verify native build target
        run: |
          $ErrorActionPreference = 'Stop'
          if ((go env GOHOSTOS) -ne '${{ matrix.goos }}' -or (go env GOHOSTARCH) -ne '${{ matrix.goarch }}' -or (go env GOOS) -ne '${{ matrix.goos }}' -or (go env GOARCH) -ne '${{ matrix.goarch }}') {
            throw 'The Go toolchain does not match the requested release target.'
          }

      - name: Install pinned linters and formatters
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          install-only: true
          skip-cache: true

      - name: Download both game variants
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $scratch = Join-Path $root ('.cache/corpus-' + [guid]::NewGuid().ToString('N'))
          $cachePrefix = [IO.Path]::GetFullPath((Join-Path $root '.cache')) + [IO.Path]::DirectorySeparatorChar
          if (-not [IO.Path]::GetFullPath($scratch).StartsWith($cachePrefix, [StringComparison]::OrdinalIgnoreCase)) { throw 'Invalid corpus scratch directory.' }
          try {
            New-Item -ItemType Directory -Force $scratch, (Join-Path $root 'game') | Out-Null
            foreach ($variant in @('softdisk', 'retail')) {
              $archive = Join-Path $scratch "$variant.zip"
              $expanded = Join-Path $scratch $variant
              Invoke-WebRequest -Uri "https://kosmodan.ru/f/ddave2-$variant.zip" -OutFile $archive
              Expand-Archive -LiteralPath $archive -DestinationPath $expanded
              Copy-Item -LiteralPath (Join-Path $expanded 'ddave2') -Destination (Join-Path $root "game/$variant") -Recurse
            }
          }
          finally {
            if (Test-Path -LiteralPath $scratch) { Remove-Item -LiteralPath $scratch -Recurse -Force }
          }

      - name: Test, enforce coverage, build, and smoke test
        run: pwsh -NoProfile -File scripts/check.ps1

      - name: Verify release version
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = if ($IsWindows) { './bin/gravedigger.exe' } else { './bin/gravedigger' }
          $version = (& $binary --version).Substring('gravedigger '.Length)
          if ($LASTEXITCODE -ne 0) { throw 'The built executable could not report its version.' }
          if ($env:GITHUB_REF.StartsWith('refs/tags/')) {
            if ($env:GITHUB_REF_NAME -notmatch '^v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$' -or $env:GITHUB_REF_NAME -ne "v$version") {
              throw "Tag $env:GITHUB_REF_NAME does not match the built version v$version."
            }
          }

      - name: Create coverage and JUnit reports
        run: |
          $ErrorActionPreference = 'Stop'
          go install gotest.tools/gotestsum@v1.13.0
          if ($LASTEXITCODE -ne 0) { throw 'Installing gotestsum failed.' }
          gotestsum --junitfile junit.xml -- -covermode=atomic '-coverprofile=coverage.out' ./...
          if ($LASTEXITCODE -ne 0) { throw 'Tests for the coverage and JUnit reports failed.' }

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          disable_search: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          disable_search: true

      - name: Package checked executable
        run: |
          $ErrorActionPreference = 'Stop'
          if ($IsWindows) {
            Compress-Archive -LiteralPath bin/gravedigger.exe -DestinationPath '${{ matrix.archive }}'
          } else {
            tar -czf '${{ matrix.archive }}' -C bin gravedigger
            if ($LASTEXITCODE -ne 0) { throw 'Packaging the executable failed.' }
          }

      - name: Upload checked archive
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gravedigger-${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release comes from master
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Download checked archives
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: gravedigger-*
          merge-multiple: true
          path: artifacts

      - name: Prepare versioned archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]
          mkdir release
          mv artifacts/gravedigger-windows-x86_64.zip "release/gravedigger-${VERSION}-windows-x86_64.zip"
          mv artifacts/gravedigger-linux-x86_64.tar.gz "release/gravedigger-${VERSION}-linux-x86_64.tar.gz"
          mv artifacts/gravedigger-macos-arm64.tar.gz "release/gravedigger-${VERSION}-macos-arm64.tar.gz"

      - name: Prepare release draft and upload all three archives
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          name: ${{ github.ref_name }}
          draft: true
          allowUpdates: true
          updateOnlyUnreleased: true
          skipIfReleaseExists: true
          artifactErrorsFailBuild: true
          replacesArtifacts: true
          omitBodyDuringUpdate: true
          generateReleaseNotes: true
          makeLatest: false
          artifacts: release/gravedigger-*-windows-x86_64.zip,release/gravedigger-*-linux-x86_64.tar.gz,release/gravedigger-*-macos-arm64.tar.gz

      - name: Publish complete release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          name: ${{ github.ref_name }}
          draft: false
          allowUpdates: true
          updateOnlyUnreleased: true
          skipIfReleaseExists: true
          omitBodyDuringUpdate: true
          makeLatest: true
